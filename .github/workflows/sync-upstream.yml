name: Sync from upstream feat/cef

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      upstream-branch:
        description: 'Upstream branch to sync from'
        required: false
        default: 'feat/cef'
        type: choice
        options:
          - feat/cef
          - amr/cef-gtk4

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sparse-checkout upstream crate
        run: |
          BRANCH="${{ github.event.inputs.upstream-branch || 'feat/cef' }}"
          echo "Syncing from branch: $BRANCH"
          git clone --filter=blob:none --no-checkout --sparse --branch "$BRANCH" \
            https://github.com/tauri-apps/tauri.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set crates/tauri-runtime-cef
          git checkout "$BRANCH"

      - name: Create merge with real conflicts
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          UPSTREAM=/tmp/upstream/crates/tauri-runtime-cef

          # Create a commit representing upstream's state on a temp branch.
          # We can't merge upstream's repo directly (it's a monorepo), so we
          # build a synthetic commit that has upstream's files and merge it.
          git checkout -b upstream-state
          # Save fork-only files
          mkdir -p /tmp/fork-only
          for f in src/config.rs src/policy.rs src/streaming.rs src/compat.rs; do
            [ -f "$f" ] && cp "$f" "/tmp/fork-only/$(basename $f)"
          done
          # Replace with upstream
          rm -rf src/
          cp -r "$UPSTREAM/src/" src/
          cp "$UPSTREAM/Cargo.toml" Cargo.toml
          # Restore fork-only files
          for f in /tmp/fork-only/*.rs; do
            [ -f "$f" ] && cp "$f" "src/$(basename $f)"
          done
          git add -A
          git commit -m "upstream state from ${{ github.event.inputs.upstream-branch || 'feat/cef' }}"

          # Go back to main and create the sync branch
          git checkout main
          git checkout -B "$BRANCH"

          # Merge upstream state. This produces real git conflict markers
          # where both the fork and upstream modified the same files.
          # Do NOT auto-resolve — push with conflict markers intact.
          git merge upstream-state --no-edit --allow-unrelated-histories 2>&1 || true

          # If there are conflicts, the working tree has conflict markers.
          # Stage everything so we can push (git requires a clean index to push,
          # but conflict markers in staged files are fine to push).
          git add -A

          # Check if there are actual conflicts (unmerged paths)
          if git diff --name-only --diff-filter=U | head -1 > /dev/null 2>&1 && [ -s <(git diff --name-only --diff-filter=U 2>/dev/null) ]; then
            # Has conflicts — commit with conflict markers preserved
            git commit -m "chore: sync from ${{ github.event.inputs.upstream-branch || 'feat/cef' }} (CONFLICTS — resolve manually)" --no-verify || true
          else
            # No conflicts — clean merge
            git commit -m "chore: sync from ${{ github.event.inputs.upstream-branch || 'feat/cef' }}" --no-verify || true
          fi

          git push --force origin "$BRANCH"

      - name: Create or update PR
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists, updated branch"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync tauri-runtime-cef from upstream ${{ github.event.inputs.upstream-branch || 'feat/cef' }}" \
              --body "Automated sync from [tauri-apps/tauri](https://github.com/tauri-apps/tauri) \`${{ github.event.inputs.upstream-branch || 'feat/cef' }}\` branch.

          Fork-only files preserved: \`config.rs\`, \`policy.rs\`, \`streaming.rs\`, \`compat.rs\`.

          If this PR has merge conflicts, checkout the branch locally and resolve them:
          \`\`\`
          git fetch origin && git checkout $BRANCH
          \`\`\`

          **CEF version:** check the \`cef\` pin in Cargo.toml — bump Sable's \`src-tauri/Cargo.toml\` to match."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
