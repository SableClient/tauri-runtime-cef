name: Sync from upstream feat/cef

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sparse-checkout upstream crate
        run: |
          git clone --filter=blob:none --no-checkout --sparse \
            https://github.com/tauri-apps/tauri.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set crates/tauri-runtime-cef
          git checkout feat/cef

      - name: Overlay upstream files
        run: |
          UPSTREAM=/tmp/upstream/crates/tauri-runtime-cef
          OVERLAY="config.rs policy.rs streaming.rs compat.rs"

          for f in $(find "$UPSTREAM/src" -type f -printf "%P\n"); do
            OVERLAY_FILE=false
            for ol in $OVERLAY; do
              if [ "$f" = "$ol" ]; then OVERLAY_FILE=true; fi
            done
            if [ "$OVERLAY_FILE" = "false" ]; then
              mkdir -p "src/$(dirname "$f")"
              cp "$UPSTREAM/src/$f" "src/$f"
            fi
          done

          sed 's|tauri-runtime = { version = "[^"]*", path = "[^"]*" }|tauri-runtime = "2.11.2"|' \
            "$UPSTREAM/Cargo.toml" > Cargo.toml.tmp
          sed -i 's|tauri-utils = { version = "[^"]*", path = "[^"]*", features = \[|tauri-utils = { version = "2.9.2", features = [|' \
            Cargo.toml.tmp
          cp Cargo.toml.tmp Cargo.toml
          rm -f Cargo.toml.tmp

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push and create PR
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add -A
          git commit -m "chore: sync from tauri-apps/tauri feat/cef"
          git push --force origin "$BRANCH"
          # Reuse existing PR if one is already open for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists, updated branch"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync tauri-runtime-cef from upstream feat/cef" \
              --body "Automated sync from [tauri-apps/tauri](https://github.com/tauri-apps/tauri) \`feat/cef\` branch.

          Overlay modules preserved: \`config.rs\`, \`policy.rs\`, \`streaming.rs\`, \`compat.rs\`.

          If this PR has merge conflicts, the upstream changed \`runtime.rs\` or \`webview.rs\` in a way that requires manual porting of the overlay modules. Fix conflicts and merge.

          **CEF version:** check the \`cef\` pin in Cargo.toml — bump Sable's \`src-tauri/Cargo.toml\` to match."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
