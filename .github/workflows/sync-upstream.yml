name: Sync from upstream feat/cef

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      upstream-branch:
        description: 'Upstream branch to sync from'
        required: false
        default: 'feat/cef'
        type: choice
        options:
          - feat/cef
          - amr/cef-gtk4

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sparse-checkout upstream crate
        run: |
          BRANCH="${{ github.event.inputs.upstream-branch || 'feat/cef' }}"
          echo "Syncing from branch: $BRANCH"
          git clone --filter=blob:none --no-checkout --sparse --branch "$BRANCH" \
            https://github.com/tauri-apps/tauri.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set crates/tauri-runtime-cef
          git checkout "$BRANCH"

      - name: Create upstream state commit
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          # Save fork-only files
          mkdir -p /tmp/fork-only
          for f in src/config.rs src/policy.rs src/streaming.rs src/compat.rs; do
            [ -f "$f" ] && cp "$f" "/tmp/fork-only/$(basename $f)"
          done

          # Replace all files with upstream's version
          UPSTREAM=/tmp/upstream/crates/tauri-runtime-cef
          rm -rf src/
          cp -r "$UPSTREAM/src/" src/
          cp "$UPSTREAM/Cargo.toml" Cargo.toml

          # Restore fork-only files
          for f in /tmp/fork-only/*.rs; do
            [ -f "$f" ] && cp "$f" "src/$(basename $f)"
          done

          # Create a commit representing upstream's state
          git add -A
          git commit -m "chore: upstream state from tauri-apps/tauri ${{ github.event.inputs.upstream-branch || 'feat/cef' }}"

          # Go back to main and create the actual sync branch
          git checkout main
          git checkout -B "$BRANCH"

          # Merge upstream state — produces real git conflicts
          # where the fork and upstream both modified the same files
          git merge "$BRANCH" --allow-unrelated-histories --no-edit || true

          # Push the branch with conflicts visible
          git add -A
          git commit -m "chore: sync from tauri-apps/tauri ${{ github.event.inputs.upstream-branch || 'feat/cef' }} (conflicts to resolve)" --allow-empty || true
          git push --force origin "$BRANCH"

      - name: Create or update PR
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists, updated branch"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync tauri-runtime-cef from upstream ${{ github.event.inputs.upstream-branch || 'feat/cef' }}" \
              --body "Automated sync from [tauri-apps/tauri](https://github.com/tauri-apps/tauri) \`${{ github.event.inputs.upstream-branch || 'feat/cef' }}\` branch.

          This PR contains merge conflicts — both the fork's version and upstream's version are shown for each modified file. Resolve conflicts by keeping the fork's patches where needed and accepting upstream's changes where they improve things.

          Fork-only files preserved: \`config.rs\`, \`policy.rs\`, \`streaming.rs\`, \`compat.rs\`.

          **CEF version:** check the \`cef\` pin in Cargo.toml — bump Sable's \`src-tauri/Cargo.toml\` to match."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
