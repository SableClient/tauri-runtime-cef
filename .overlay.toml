# Overlay configuration for the tauri-runtime-cef fork.
#
# Files in src/ that the fork has MODIFIED relative to upstream are automatically
# preserved — the sync script diffs each file and keeps the fork's version
# wherever it differs. This means you never need to maintain a list of modified
# files; just edit them in the fork and the sync will preserve them.
#
# New files that exist only in the fork (config.rs, policy.rs, streaming.rs,
# compat.rs) are also automatically preserved because they don't exist upstream.
#
# Files listed in `force-overwrite` below are always overwritten from upstream,
# even if the fork modified them. Use this for files where you want to track
# upstream changes and re-apply patches manually.
force-overwrite = []

# Extra Cargo.toml fields that the fork adds but upstream doesn't have.
# These are appended after workspace-inherited fields are resolved.
[cargo.package]
authors = ["Tauri Programme within The Commons Conservancy", "byeongsu-hong"]
homepage = "https://github.com/SableClient/tauri-runtime-cef"
repository = "https://github.com/SableClient/tauri-runtime-cef"
categories = ["gui"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.88"
description = "CEF (Chromium Embedded Framework) runtime for Tauri: Chromium renders every webview while the app keeps Tauri's Builder, commands and plugins. Ported from tauri's feat/cef branch onto published tauri crates — no fork, no [patch.crates-io]. Adds a deny-by-default Chromium permission policy the app supplies."

# Dependencies to convert from path deps to version deps.
[cargo.dep-versions]
tauri-runtime = "2.11.2"
tauri-utils = "2.9.2"

# Dev-dependencies that the fork adds but upstream doesn't have.
# These are appended to Cargo.toml after resolution.
[[cargo.dev-dependencies]]
name = "tauri"
version = "2"
default-features = false
features = ["test"]
